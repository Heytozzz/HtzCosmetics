# Cloudflare Worker configuration for the HtzCosmetics backend (free plan).
name = "htzcosmetics"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[[d1_databases]]
binding = "DB"
database_name = "htzcosmetics"
database_id = "bc902033-98cf-4e04-8674-af1a62b9be76"
migrations_dir = "migrations"

# Approximate per-location limits (keys: client IP for auth/read, player UUID for writes; never stored).
[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "7101"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "READ_LIMITER"
namespace_id = "7102"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "FRESH_LIMITER"
namespace_id = "7104"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "WRITE_LIMITER"
namespace_id = "7103"
simple = { limit = 10, period = 60 }

# Cleans up expired login challenges.
[triggers]
crons = ["*/30 * * * *"]

# TOKEN_SECRET is a secret (wrangler secret put TOKEN_SECRET), never stored in this file.
