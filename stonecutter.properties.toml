# All mod and dependency versions in one place.
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "htzcosmetics"
mod.name = "HtzCosmetics"
mod.group = "com.heytozzz.htzcosmetics"
mod.version = "0.1.0"

loomx.loom_version = "1.19.4"
deps.junit = "6.1.3"

["1.21.8"]
# Releases to mark as compatible on Modrinth/CurseForge
mod.mc_releases = ["1.21.8"]

# Per version we BUILD and TEST against the OLDEST Fabric API released for it, and the loader that API
# requires, and declare exactly those as minimums: the mod then works on every newer one too (modpacks
# often pin older loaders). Fabric only adds APIs in newer versions, it does not remove them.

[fabric."1.21.8"]
# Compatibility range written into fabric.mod.json
mod.mc_compat = "1.21.8"
# Oldest Fabric API build for 1.21.8 (it requires fabricloader >= 0.16.13).
deps.fabric_api = "0.129.0+1.21.8"
deps.fabric_api_min = "0.129.0"
deps.fabric_loader = "0.16.13"

["1.21.10"]
mod.mc_releases = ["1.21.10"]

[fabric."1.21.10"]
mod.mc_compat = "1.21.10"
deps.fabric_api = "0.134.1+1.21.10"
deps.fabric_api_min = "0.134.1"
deps.fabric_loader = "0.17.0"

["1.21.11"]
mod.mc_releases = ["1.21.11"]

[fabric."1.21.11"]
mod.mc_compat = "1.21.11"
deps.fabric_api = "0.139.4+1.21.11"
deps.fabric_api_min = "0.139.4"
deps.fabric_loader = "0.17.3"

["26.1"]
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]

[fabric."26.1"]
mod.mc_compat = ">=26.1 <26.2"
deps.fabric_api = "0.144.0+26.1"
deps.fabric_api_min = "0.144.0"
deps.fabric_loader = "0.18.4"

["26.2"]
mod.mc_releases = ["26.2"]

[fabric."26.2"]
mod.mc_compat = ">=26.2 <26.3"
deps.fabric_api = "0.152.1+26.2"
deps.fabric_api_min = "0.152.1"
deps.fabric_loader = "0.18.4"

["26.3"]
mod.mc_releases = ["26.3"]

[fabric."26.3"]
mod.mc_compat = ">=26.3 <26.4"
deps.fabric_api = "0.160.5+26.3"
deps.fabric_api_min = "0.160.5"
deps.fabric_loader = "0.19.3"
