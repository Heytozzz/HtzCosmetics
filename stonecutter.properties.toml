# All mod and dependency versions in one place.
# See https://stonecutter.kikugie.dev/wiki/config/properties#centralized-properties
mod.id = "htzcosmetics"
mod.name = "HtzCosmetics"
mod.group = "com.heytozzz.htzcosmetics"
mod.version = "0.1.0"

# We BUILD and TEST against the OLDEST supported versions, so the mod works on every newer one too
# (modpacks often pin older loaders). Fabric only adds APIs in newer versions, it does not remove them.
deps.fabric_loader = "0.16.13"
loomx.loom_version = "1.19.4"
deps.junit = "6.1.3"

["1.21.8"]
# Releases to mark as compatible on Modrinth/CurseForge
mod.mc_releases = ["1.21.8"]

[fabric."1.21.8"]
# Compatibility range written into fabric.mod.json
mod.mc_compat = "1.21.8"
# Oldest Fabric API build for 1.21.8 (it requires fabricloader >= 0.16.13).
deps.fabric_api = "0.129.0+1.21.8"
deps.fabric_api_min = "0.129.0"
